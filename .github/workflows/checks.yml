name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_project.py
      - run: python build_package.py
      - run: python tools/check_project.py --archive dist/heiko_w600-ha-0.5.2.zip
      - run: |
          cp dist/heiko_w600-ha-0.5.2.zip /tmp/heiko-first.zip
          python build_package.py
          cmp /tmp/heiko-first.zip dist/heiko_w600-ha-0.5.2.zip
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-ha-test.txt
      - run: python tools/ha_smoke.py
